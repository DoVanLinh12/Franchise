name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, type-check, unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - name: Pytest with coverage (min 30%)
        run: |
          mkdir -p reports
          python -m pytest \
            --junitxml=reports/junit.xml \
            --cov=app --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-fail-under=30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: src/backend/reports/

  frontend:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/frontend/app.js

  integration:
    name: Database and Postman API tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose --profile full --profile test --profile tools config --quiet
      - name: Build application images
        run: docker compose build api frontend
      - name: Set up database, run SQL tests, seed data
        run: |
          docker compose up -d postgres
          docker compose run --rm database-setup
          docker compose --profile test run --rm database-test
          docker compose run --rm seed
      - name: Run Postman collection with Newman
        run: |
          mkdir -p reports/postman
          docker compose --profile test run --rm postman
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.txt
      - name: Run end-to-end tests against the running stack
        working-directory: src/backend
        run: |
          docker compose -f ../../docker-compose.yml --profile full up -d api worker beat mailhog
          pip install -r requirements-dev.txt
          E2E_BASE_URL=http://localhost:8000 python -m pytest -m e2e tests/e2e -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postman-report
          path: reports/postman/
      - name: Show API logs on failure
        if: failure()
        run: docker compose logs api
      - name: Tear down
        if: always()
        run: docker compose --profile full --profile test --profile tools down --volumes --remove-orphans

  deploy:
    name: Publish Docker images to GHCR
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API and frontend images
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for service in api frontend; do
            if [ "$service" = api ]; then context=src/backend; else context=src/frontend; fi
            image="ghcr.io/${owner}/franchise-${service}"
            docker build -t "${image}:${{ github.sha }}" -t "${image}:latest" "$context"
            docker push "${image}:${{ github.sha }}"
            docker push "${image}:latest"
          done
