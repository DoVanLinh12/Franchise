[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["e2e: end-to-end tests against a running stack (docker compose)"]
cache_dir = "/tmp/pytest_cache"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 30
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/e2e/*" = ["E501"]
"app/services/export_service.py" = ["E501"]
"tests/test_exports.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["asyncpg", "celery"]
ignore_missing_imports = true
